<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat Container Gadget</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/tailwindcss@3.4.11/dist/tailwind.min.css"
    />
    <script src="https://www.renderjs.org/rsvp-latest.js"></script>
    <script src="https://www.renderjs.org/renderjs-latest.js"></script>
    <script src="./chat_container.js"></script>
  </head>
  <body class="h-full">
    <div class="flex h-full" data-role="chat-shell">
      <div
        class="flex flex-1 overflow-y-auto"
        data-ref="container"
        role="log"
        aria-live="polite"
      >
        <div class="flex w-full flex-col" data-ref="content">
          <div
            class="h-px w-full shrink-0 scroll-mt-4"
            data-ref="anchor"
            aria-hidden="true"
          ></div>
        </div>
      </div>
    </div>

    <template id="message-template">
      <article class="rounded-lg border border-slate-800 bg-slate-900/70 p-4 shadow">
        <div class="mb-2 flex items-center gap-2 text-sm uppercase tracking-wide text-emerald-300">
          <span data-ref="author"></span>
          <span class="text-slate-500">/</span>
          <span class="text-xs text-slate-400">message</span>
        </div>
        <p class="text-sm leading-relaxed text-slate-100" data-ref="text"></p>
      </article>
    </template>
  </body>
</html>
