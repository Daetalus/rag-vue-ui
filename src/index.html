<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>RenderJS Chat Container</title>

    <!-- RenderJS 依赖 -->
    <script src="rsvp.js"></script>
    <script src="renderjs.js"></script>

    <!-- 本 gadget 逻辑 -->
    <script src="./rjs_components/chat_container_gadget.js"></script>

    <!-- 可以继续沿用你原来 Tailwind 的类名 -->
    <style>
      /* 只补几个最基本的样式，假如没有 Tailwind 也能看 */
      body {
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }

      .page-root {
        display: flex;
        flex-direction: column;
        height: 100vh;
      }

      .chat-log-container {
        flex: 1;
        overflow-y: auto;
      }

      .chat-content {
        display: flex;
        flex-direction: column;
        width: 100%;
      }

      .chat-message {
        padding: 0.5rem 1rem;
      }

      .chat-message:nth-child(odd) {
        background: #f5f5f5;
      }

      .chat-input-row {
        display: flex;
        padding: 0.5rem;
        gap: 0.5rem;
        border-top: 1px solid #ddd;
      }

      .chat-input-row input[type="text"] {
        flex: 1;
        padding: 0.4rem 0.6rem;
      }

      .chat-input-row button {
        padding: 0.4rem 0.8rem;
      }
    </style>
  </head>

  <body>
    <!-- 整个页面就是一个 RenderJS gadget（对应原来的 ChatContainerRoot 根） -->
    <div class="page-root">
      <!-- ChatContainerRoot：外层可滚动容器 -->
      <div
        data-role="chat-root"
        class="chat-log-container flex flex-1 overflow-y-auto"
        role="log"
        aria-label="Chat messages"
      >
        <!-- ChatContainerContent：内部内容区域 -->
        <div
          data-role="chat-content"
          class="chat-content flex w-full flex-col space-y-4"
        >
          <!-- 示例消息，实际项目里由 JS 动态插入 -->
          <div class="chat-message">Hello from RenderJS</div>
          <div class="chat-message">This container can auto-scroll.</div>
        </div>

        <!-- ChatContainerScrollAnchor：底部锚点 -->
        <div
          data-role="chat-scroll-anchor"
          class="h-px w-full shrink-0 scroll-mt-4"
          aria-hidden="true"
        ></div>
      </div>

      <!-- 简单输入 + 按钮，方便你测试 append + auto scroll -->
      <form class="chat-input-row" data-role="chat-input">
        <input
          type="text"
          name="message"
          placeholder="Type message and press Send"
          autocomplete="off"
        />
        <button type="submit">Send</button>
      </form>
    </div>
  </body>
</html>
